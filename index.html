<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Space - Portal Studenta</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <a href="#main-content" class="skip-link">Przejdź do głównej treści</a>

    <div class="app-container">
        <nav class="sidebar" aria-label="Główna nawigacja">
            <div class="logo">
                <h2>Edu Space</h2>
                <small style="color: #9CA3AF;">Ver. Akademicka</small>
            </div>
            <ul class="nav-links">
                <li>
                    <button onclick="router.loadPage('dashboard')" aria-current="page" id="nav-dashboard">
                        Pulpit
                    </button>
                </li>
                <li>
                    <button onclick="router.loadPage('grades')" id="nav-grades">
                        Indeks / Oceny
                    </button>
                </li>
                <li>
                    <button onclick="router.loadPage('schedule')" id="nav-schedule">
                        Plan Zajęć
                    </button>
                </li>
            </ul>
            
            <div class="user-profile">
                <div class="avatar-circle">JN</div>
                <div class="user-info">
                    <span class="user-name">Jan Nowak</span>
                    <small>Informatyka, Sem. 3</small>
                    <small class="album-id">Nr albumu: 42910</small>
                </div>
            </div>
        </nav>

        <main id="main-content" class="content-area" tabindex="-1">
            <header class="top-bar">
                <h1 id="page-title">Witaj w Edu Space</h1>
                <div class="status-indicator" aria-label="Status systemu">
                    <span class="dot online"></span> AWS Cloud Active
                </div>
            </header>
            
            <div id="app-view" class="view-container">
                <div class="loader" role="status">Ładowanie danych studenta...</div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
